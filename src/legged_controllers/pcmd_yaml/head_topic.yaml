head_topic_controller:
  # 图像中心周围的死区（半量程的分数，例如 0.05 = ±5%）。
  # 小于此值的像素偏移将被忽略，以抑制相机噪声。
  dead_zone: 0.05

  # 从归一化像素偏移到角度增量（弧度）的比例系数。
  # 推导：在 x=0.96 时，测得的偏航角为 0.533 弧度 → 0.533/(0.96-0.5)=1.16。
  # 除以 5 次更新（500 毫秒 / 100 毫秒）得到每周期增量：1.16/5 = 0.232。
  scale: 0.232

  # 累积偏航角目标值的硬限制（弧度）。
  yaw_clamp_min: -0.8
  yaw_clamp_max:  0.8

  # 累积俯仰角目标值的硬限制（弧度）。
  pitch_clamp_min: -0.4
  pitch_clamp_max:  0.4

  # 在连续收到 z==-1 的 /eye_target 消息达到此次数后，
  # 该话题信号将被视为丢失，头部将回退到脚本姿态。
  invalid_frame_threshold: 10

  # 从当前指令姿态过渡到「最新 eye_target 目标」的固定时长（秒），与话题发布频率无关。
  # 控制器在 policy 频率（如 500 Hz）下按墙钟时间做线性插值；定值越短响应越快，越长越顺。
  topic_blend_duration_sec: 0.1

  # 当 /eye_target 连续无效触发 topic->script 回退时，
  # 从当前头部指令姿态平滑过渡到脚本姿态的时长（秒），用于抑制切换跳变。
  fallback_blend_duration_sec: 0.3

  # 话题模式下的颈部 PD（顺序：偏航、俯仰、滚动）：/eye_target 的 z 有效时跟随目标；
  # 当脚本关闭且 /eye_target 无效时，用同一组 PD 锁定默认零位。
  # 脚本时间轴或 hybrid 在 z 无效回退脚本姿态时，使用 head_script.yaml 里的脚本 PD。
  # 若此处 kp/kd 全为 0，话题跟踪时关节力矩来自 PD 项为 0；若头仍明显跟随目标，多为底层对 position 指令仍有刚度/内环。
  kp:     [3.5, 4.0, 3.0]
  kd:     [2.0, 1.0, 0.6]
  tau_ff: [0.0, 0.0, 0.0]
