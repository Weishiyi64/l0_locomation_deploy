      #单脚下跪后向后倒，倒下后停止进emergencystop
    - name: l0_v3_mimic_liedown_new
      label: LT+Down
      enabled: true
      policy: "l0_v2_mimic_dunxia_dunzhe_dunqi"
      on_finish: emergency_stop
      combo:
        buttons: [LT_button]
        dpad: down

    # Double-leg kneel then lie down; terminal hold is followed by EmergencyStop.
    - name: l0_v3_mimic_liedown9_24
      label: LT+Left
      enabled: true
      policy: "l0_v3_mimic_LieDown9_24_10_9_flat1010"
      on_finish: emergency_stop
      combo:
        buttons: [LT_button]
        dpad: left

    #双腿下蹲后倒下的手柄按键，倒下后停止进emergencystop，加落地冲量惩罚
    - name: l0_v3_mimic_liedown2
      label: LT+Right
      enabled: true
      policy: "l0_v3_mimic_LieDown_2_liedown2_1015_2"
      on_finish: emergency_stop
      combo:
        buttons: [LT_button]
        dpad: right
    
