joystick_imitation_actions:
  # D-pad values follow the current /joy mapping:
  # DPad_lr axis 6: left=+1, right=-1
  # DPad_ud axis 7: up=+1, down=-1
  axis_threshold: 0.5
  actions:
    - name: imitation_lt_up
      label: LT+Up
      enabled: true
      policy: "mma_kick_stable"
      shot_id: 16
      combo:
        buttons: [LT_button]
        dpad: up
    - name: imitation_lt_down
      label: LT+Down
      enabled: true
      policy: "samba_dance"
      shot_id: 2
      combo:
        buttons: [LT_button]
        dpad: down
    - name: imitation_lt_left
      label: LT+Left
      enabled: true
      policy: "rallying_stable"
      shot_id: 12
      combo:
        buttons: [LT_button]
        dpad: left
    - name: imitation_lt_right
      label: LT+Right
      enabled: true
      policy: "swing_dancing"
      shot_id: 4
      combo:
        buttons: [LT_button]
        dpad: right
    - name: imitation_rt_up
      label: RT+Up
      enabled: true
      policy: "loser_stable"
      shot_id: 9
      combo:
        buttons: [RT_button]
        dpad: up
    - name: imitation_rt_down
      label: RT+Down
      enabled: true
      policy: "rejected_stable"
      shot_id: 11
      combo:
        buttons: [RT_button]
        dpad: down
    - name: imitation_rt_left
      label: RT+Left
      enabled: true
      policy: "taunt_2_stable"
      shot_id: 14
      combo:
        buttons: [RT_button]
        dpad: left
    - name: imitation_rt_right
      label: RT+Right
      enabled: true
      policy: "y1_v3_mimic_07150"
      shot_id: 8
      combo:
        buttons: [RT_button]
        dpad: right
