name: ROS 2 Humble interfaces

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: '["ubuntu-22.04"]'
          - architecture: arm64
            runner: '["self-hosted", "Linux", "ARM64"]'
    runs-on: ${{ fromJSON(matrix.runner) }}
    name: Humble / ${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@v4
      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble
      - uses: ros-tooling/action-ros-ci@v0.4
        with:
          package-name: luvbot_hardware_interfaces luvbot_control_interfaces
          target-ros2-distro: humble
          skip-tests: false
